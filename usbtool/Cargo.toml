[package]
name = "remboot-usb"
version = "0.1.0"
edition = "2021"
description = "Cross-platform USB provisioner for RemBoot (partition, format, copy)"
license = "GPL-3.0-or-later"

[[bin]]
name = "remboot-usb"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[package.metadata.deb]
maintainer = "rem9000 <rem9000@users.noreply.github.com>"
copyright = "2026, Rem"
license-file = ["../LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "gdisk, dosfstools, exfatprogs"
extended-description = "Provision a USB stick as a RemBoot drive: partition (FAT32 ESP + exFAT data, or a single FAT32), format, and copy the boot app plus your ISOs. Includes a local web GUI (remboot-usb gui)."
