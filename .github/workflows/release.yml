name: Release

# Cut a release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  efi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - run: cargo build -p remboot --release --target x86_64-unknown-uefi
      - run: cp target/x86_64-unknown-uefi/release/remboot.efi BOOTX64.EFI
      - uses: actions/upload-artifact@v4
        with:
          name: efi
          path: BOOTX64.EFI

  linux-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Build + embed the app
        run: |
          cargo build -p remboot --release --target x86_64-unknown-uefi
          cp target/x86_64-unknown-uefi/release/remboot.efi usbtool/embedded-efi.bin
      - run: cargo install cargo-deb --locked
      - run: cargo build -p remboot-usb --release --features embed-efi
      - run: cargo deb -p remboot-usb --no-build
      - name: Stage artifacts
        run: |
          mkdir out
          cp target/release/remboot-usb out/remboot-usb-linux-x86_64
          cp target/debian/*.deb out/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tool
          path: out/*

  windows-tool:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Build + embed the app
        shell: bash
        run: |
          cargo build -p remboot --release --target x86_64-unknown-uefi
          cp target/x86_64-unknown-uefi/release/remboot.efi usbtool/embedded-efi.bin
      - run: cargo build -p remboot-usb --release --features embed-efi
      - name: Stage artifact
        shell: bash
        run: cp target/release/remboot-usb.exe remboot-usb-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tool
          path: remboot-usb-windows-x86_64.exe

  release:
    needs: [efi, linux-tool, windows-tool]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
